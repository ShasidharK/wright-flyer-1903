<title>Wright Flyer 1903</title>
<style>
  :root { --bg:#121314; --panel:rgba(22,23,24,.85); --line:#26292b; --ink:#c9d0db; --dim:#7d8796; --accent:#ff9d3c; }

  :root[data-theme="light"] { color-scheme:light; --bg:#e9eaea; --panel:rgba(246,246,245,.9); --line:#d6d8d8; --ink:#2b2e30; --dim:#6b7075; }
  * { box-sizing:border-box; }
  @media (max-width:900px) { .build { display:none; } }

  #theme { all:unset; cursor:pointer; width:28px; height:28px; display:grid; place-items:center; border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--ink); font-size:14px; }

  .swatches button i { width:10px; height:10px; border-radius:50%; background:var(--sw); transition:transform .2s; }
  .swatches button:hover i { transform:scale(1.18); }
  .swatches button[aria-checked="true"] { box-shadow:0 0 0 1px var(--sw) inset; }
  #spin { all:unset; cursor:pointer; height:28px; padding:0 11px 0 9px; display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--dim); font-size:14px; }
  #spin span { font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  #spin[aria-pressed=true] { color:var(--accent); border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .seg { display:flex; min-width:0; max-width:100%; overflow-x:auto; scrollbar-width:none; padding:3px; gap:2px; border:1px solid var(--line); border-radius:999px; background:var(--panel); }
  .seg button { all:unset; flex:none; white-space:nowrap; cursor:pointer; padding:5px 12px; border-radius:999px; color:var(--dim); font-size:11px; letter-spacing:.06em; }

  .seg button[aria-selected=true] { color:var(--ink); background:var(--bg); box-shadow:0 0 0 1px var(--accent) inset; }
  .ctl.hide { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow:hidden; }

  .brand i { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  /* the No LAG lockup: "No" over "In", then Learn And Growth whose capitals are as big as both lines and the gap together;
     the bottom line ("In earn nd rowth") shares one baseline with the capitals */
  .lag { --lag-s:9px; --lag-gap:2px; display:flex; align-items:last baseline; gap:5px; line-height:1; white-space:nowrap; }
  .lag-st { display:flex; flex-direction:column; gap:var(--lag-gap); font-size:var(--lag-s); letter-spacing:.04em; }
  .lag-w { font-size:var(--lag-s); letter-spacing:.02em; }

  .sw button { width:16px; height:16px; border-radius:50%; border:1px solid rgba(255,255,255,.25); cursor:pointer; padding:0; }
  .sw button[aria-pressed=true] { outline:2px solid var(--ink); outline-offset:2px; }
  #ctl { top:64px; right:16px; display:flex; flex-direction:column; gap:6px; width:182px; max-height:calc(100vh - 140px); overflow:auto; }
  .ctl button { all:unset; pointer-events:auto; cursor:pointer;   /* all:unset would otherwise inherit pointer-events:none from .ui */
    padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); display:flex; justify-content:space-between; color:var(--dim); }
  .ctl button:hover { color:var(--ink); }

  #info { left:16px; bottom:62px; max-width:min(400px, calc(100vw - 32px)); padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// Source model units are cm, Z-up, nose toward −y, starboard toward −x (after mirroring).
// Three.js: X = x, Y = z, Z = −y (metres).
const V = (x, y, z) => new THREE.Vector3(x / 100, z / 100, -y / 100);
const themeHooks = [];       // per-figure theme updates
let active = 'heli';           // which figure is on screen
let camAnim = null;            // iso-view snap animation

// ── renderer, scene, camera ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121314);
const persp = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 400);
// true isometric: an orthographic camera (parallel edges stay parallel, like the iso figures); Iso view toggles it
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
let orthoH = 10;                                   // frustum height (m) at zoom 1
let camera = persp;
const TARGET = new THREE.Vector3(0, 2.0, 0.5), ISO = new THREE.Vector3(-1, 1, 1).normalize();
const fitDist = () => 40 * Math.max(1, 1.45 / persp.aspect);
camera.position.copy(TARGET).addScaledVector(ISO, fitDist());
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 4; controls.maxDistance = 120;

const hemi = new THREE.HemisphereLight(0xdde4ff, 0x080808, 0.7); scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0); scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(6, 14, 10); scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899bb, 0.2); fill.position.set(-10, 4, -8); scene.add(fill);

// screen-space soft gradients + dither, so glows and light pools stay smooth instead of banded or blocky
const NOISE = `float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }`;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { samples: 4, type: THREE.HalfFloatType }));
const renderPass = new RenderPass(scene, camera); composer.addPass(renderPass);
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; ${NOISE}
    void main() { vec4 c = texture2D(tDiffuse, vUv); c.rgb += (hash(gl_FragCoord.xy) - 0.5) / 255.0; gl_FragColor = c; }`,
}));
composer.setSize(innerWidth, innerHeight);   // render targets at device resolution (a custom target starts at CSS size → blurry on Retina)

// ── palette & materials ──
const PALETTE = [['Sodium', '#ff9d3c'], ['Tungsten', '#ffd27a'], ['Neon', '#ff4fa3'], ['Signal', '#3ee08f'], ['Dusk', '#7b8cff'], ['Moon', '#cfe3ff']];
const accent = new THREE.Color(PALETTE[0][1]);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1b1c1f, roughness: 0.9, metalness: 0.05, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const bladeMat = new THREE.MeshStandardMaterial({ color: 0x1d1e21, roughness: 0.8, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const padMat = new THREE.MeshBasicMaterial({ color: 0x18191b });          // unlit, so cabin lights don't leak through the hull onto the deck
// tinted see-through glass: the lit cockpit and cabin show through it, it doesn't glow by itself
const glassMat = new THREE.MeshStandardMaterial({ color: 0x0b0d10, roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide, emissive: accent.clone(), emissiveIntensity: 0 });
const devRes = () => renderer.getDrawingBufferSize(new THREE.Vector2());
// two tiers like the iso figures: silhouette outline (--line) and crease/detail edges (--detail); always 1 CSS px
// three tiers, as in the iso figures: silhouette (--line) > major folds > minor detail (--detail, barely above the face fill)
const LINE_COL = new THREE.Color(0x4f5357), MAJOR_COL = new THREE.Color(0x393c3f), EDGE_COL = new THREE.Color(0x27292c), BG_COL = new THREE.Color(0x121314);
const MAJOR_ANGLE = 60;
// lines are pulled slightly toward the camera so the surface they sit on never hides parts of them
const lineOpts = { linewidth: 1, resolution: devRes(), polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -6 };
const lineMat = new LineMaterial({ color: EDGE_COL, ...lineOpts });
const majorMat = new LineMaterial({ color: MAJOR_COL, ...lineOpts });
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { color: { value: LINE_COL.clone() }, thickness: { value: 1 }, res: { value: devRes() } },
  vertexShader: `uniform float thickness; uniform vec2 res;
    void main() {
      vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      vec4 n = projectionMatrix * vec4(normalize(normalMatrix * normal), 0.0);
      vec2 d = length(n.xy) > 1e-5 ? normalize(n.xy) : vec2(0.0);
      p.xy += d * thickness * 2.0 / res * p.w;
      gl_Position = p;
    }`,
  fragmentShader: `uniform vec3 color; void main() { gl_FragColor = vec4(color, 1.0); }`,
  side: THREE.BackSide,
  // push the silhouette shell behind the hull: seen from inside the cabin it would otherwise sit exactly on the inner walls and z-fight
  polygonOffset: true, polygonOffsetFactor: 6, polygonOffsetUnits: 24,
});
const accentMats = [];
const glowMat = (base = 0x1a1d22) => { const m = new THREE.MeshStandardMaterial({ color: base, emissive: accent.clone(), emissiveIntensity: 0, roughness: 0.35 }); accentMats.push(m); return m; };
const navMat = glowMat(), beaconMat = glowMat(), padLightMat = glowMat();
// lamp halos: one screen-facing point per lamp, shaded per pixel (no full-screen bloom, so no blocky upsampled halos)
const glowMats = [];
function glowPoints(positions, size) {
  const g = new THREE.BufferGeometry().setFromPoints(positions);
  const m = new THREE.ShaderMaterial({
    uniforms: { color: { value: accent.clone() }, intensity: { value: 0 }, size: { value: size }, scale: { value: 1 }, light: { value: 0 }, ortho: { value: 0 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    // the sprite is pulled half its size toward the camera so the deck it sits on can't clip its lower half
    vertexShader: `uniform float size, scale, ortho;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = ortho > 0.5 ? size * scale : size * scale / -mv.z;
        mv.xyz -= normalize(mv.xyz) * size * 0.5;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `uniform vec3 color; uniform float intensity, light; ${NOISE}
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;
        float halo = exp(-d * d * 9.0) * (1.0 - d);
        float core = 1.0 - smoothstep(0.05, 0.12, d);
        float a = (halo * 0.7 + core * 0.9) * intensity + (hash(gl_FragCoord.xy) - 0.5) / 255.0;
        vec3 c = mix(color, vec3(1.0), core * 0.6 * (1.0 - light));
        // dark theme adds light; light theme lays the halo over the pale deck as a tint
        gl_FragColor = light > 0.5 ? vec4(c, clamp(a, 0.0, 1.0)) : vec4(c * max(a, 0.0), 1.0);
      }`,
  });
  if (theme === 'light') { m.blending = THREE.NormalBlending; m.uniforms.light.value = 1; }   // lamps created after a theme switch
  glowMats.push(m);
  return new THREE.Points(g, m);
}
// soft radial pool (light on the deck, or the aircraft's shadow), computed per pixel and dithered
const softGlows = [];   // additive halos / light pools / haze: shown in the dark theme only
const softMat = (color, additive) => { const m = softMat0(color, additive); if (additive) { softGlows.push(m); } return m; };
function softMat0(color, additive) { return new THREE.ShaderMaterial({
  uniforms: { color: { value: new THREE.Color(color) }, opacity: { value: 0 } },
  transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, toneMapped: false,
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 color; uniform float opacity; varying vec2 vUv; ${NOISE}
    void main() {
      float d = length(vUv - 0.5) * 2.0;
      float a = smoothstep(1.0, 0.0, d); a *= a;
      a = a * opacity + (hash(gl_FragCoord.xy) - 0.5) / 255.0;
      gl_FragColor = vec4(color, max(a, 0.0));
    }`,
}); }
const spotMat = softMat(0xffffff, true), spillMat = softMat(0xffffff, true), shadowMat = softMat(0x000000, false);
const cabinLight = new THREE.PointLight(0xffffff, 0, 2.3, 2), cockpitLight = new THREE.PointLight(0xffffff, 0, 1.9, 2);
// ── themes (same tokens as the iso figures' light and dark themes) ──
const THEMES = {
  dark:  { bg: 0x121314, body: 0x1b1c1f, blade: 0x1d1e21, pad: 0x18191b, lamp: 0x1a1d22, line: 0x4f5357, major: 0x393c3f, edge: 0x27292c,
           sky: 0xdde4ff, ground: 0x080808, hemi: 0.7, amb: 0, sun: 0.7, fill: 0.2, shadow: 0.7, fadeMin: 0.45 },
  light: { bg: 0xe9eaea, body: 0xf1f1f0, blade: 0xececeb, pad: 0xf6f6f5, lamp: 0xd8dadb, line: 0x5d6266, major: 0x8a8f93, edge: 0xb9bcbf,
           sky: 0xffffff, ground: 0xe6e6e6, hemi: 0.9, amb: 1.6, sun: 0.35, fill: 0.15, shadow: 0.16, fadeMin: 0.8 },
};
let theme = 'dark', accentHex = PALETTE[0][1];
function setAccent(hex) {
  accentHex = hex;
  accent.set(hex);
  accentMats.forEach(m => m.emissive.copy(accent));
  glassMat.emissive.copy(accent);
  glowMats.forEach(m => m.uniforms.color.value.copy(accent));
  [spotMat, spillMat].forEach(m => m.uniforms.color.value.copy(accent));
  cabinLight.color.copy(accent); cockpitLight.color.copy(accent);
  document.documentElement.style.setProperty('--accent', '#' + accent.getHexString());
}

// ── line helpers ──
const fatLines = [];
const fat = (arr, mat = lineMat) => { const l = new LineSegments2(new LineSegmentsGeometry().setPositions(arr), mat); fatLines.push(l); return l; };

// One FIGS3D.push({ id, name, mod }) per figure; mod is the figure module (see the iso-glow skill, "3D mode").
// When this list has figures, only they get tabs; the built-in figures above stay as working references.
const FIGS3D = [];
// Animated .glb → iso-glow 3D, keeping the model's node tree so its own animation clips play.
// isoGlb(elId, size, done) loads the base64 glb in <script type="application/octet-stream" id=elId>, styles it and fits it.
// Nothing animated is touched: each mesh becomes an invisible holder (it keeps its name, node, children and morph weights,
// so the clips still bind to it) and gets a styled twin as its child, rescaled so the twin's geometry is in scene units.
// The crease finder has fixed tolerances (merge 1e-4, drop fragments < 6 cm) that only work at scene scale — the robot's
// parts are stored 0.01 units big and blown up ×56 by their nodes, which used to merge points wrongly and drop most lines.
// · rigid mesh   → body material, silhouette shell and crease hairlines as children: they ride the node's animation
// · skinned mesh → stays skinned (no cracks); its shell is skinned too; crease hairlines are pinned to the bone that
//                  carries most of each segment's weight (exact on rigid parts, a hair off across soft joints)
// · morph targets (face expressions) → the shell follows them; crease hairlines stay on the neutral shape

// silhouette shell that also understands skinning and morph targets; shares the template outline's uniforms, so theme,
// resolution and line weight changes reach it. Extrudes along a smoothed normal, so flat-shaded corners don't split it open.
const isoOutlineMat = new THREE.ShaderMaterial({
  uniforms: outlineMat.uniforms,
  vertexShader: `uniform float thickness; uniform vec2 res; attribute vec3 outlineNormal;
    #include <common>
    #include <morphtarget_pars_vertex>
    #include <skinning_pars_vertex>
    void main() {
      vec3 objectNormal = outlineNormal;
      #include <skinbase_vertex>
      #include <skinnormal_vertex>
      #include <begin_vertex>
      #include <morphtarget_vertex>
      #include <skinning_vertex>
      vec4 p = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
      vec4 n = projectionMatrix * vec4(normalize(normalMatrix * objectNormal), 0.0);
      vec2 d = length(n.xy) > 1e-5 ? normalize(n.xy) : vec2(0.0);
      p.xy += d * thickness * 2.0 / res * p.w;

    }`,
  fragmentShader: outlineMat.fragmentShader,
  // no depth push (the template's shell is pushed back for cabin interiors): a part in front of another — the robot's eyes on
  // its face — keeps its outline instead of sinking behind the surface just behind it
  side: THREE.BackSide,
});

// area-weighted face normals summed per position: one normal per corner, however the mesh is split for flat shading
function smoothNormals(g) {
  const p = g.attributes.position, n = p.count, key = i => `${Math.round(p.getX(i) * 1e4)},${Math.round(p.getY(i) * 1e4)},${Math.round(p.getZ(i) * 1e4)}`;

  const acc = new Float32Array(id.size * 3), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), vi = q => g.index ? g.index.getX(q) : q;

    for (const i of [i0, i1, i2]) { acc[slot[i] * 3] += b.x; acc[slot[i] * 3 + 1] += b.y; acc[slot[i] * 3 + 2] += b.z; }

}

// crease hairlines of a skinned twin, each segment pinned to its heaviest bone (in that bone's space, from the bind pose)
function skinCreases(sm, slot) {

  for (let i = 0; i < p.count; i++) byKey.set(keyAt(p.getX(i), p.getY(i), p.getZ(i)), i);
  const near = (x, y, z) => { const i = byKey.get(keyAt(x, y, z)); if (i !== undefined) return i;   // mergeVertices moved it a hair: nearest vertex
    let best = 0, bd = Infinity; for (let j = 0; j < p.count; j++) { const d = (p.getX(j) - x) ** 2 + (p.getY(j) - y) ** 2 + (p.getZ(j) - z) ** 2; if (d < bd) { bd = d; best = j; } } return best; };

// contact lines: where two parts that move together pass into each other (eyes set into a face, a rivet in a band), the
// visible edge is neither a silhouette nor a crease of either part, so neither shows it. Intersect their triangles once, in
// their shared parent's space, and hang the result on one of them as a fold line. Parts moved by a transform track are skipped.
function contactLines(twins, clips) {
  const moved = new Set(clips.flatMap(c => c.tracks.filter(t => /\.(position|quaternion|scale)$/.test(t.name)).map(t => t.name.replace(/\.[^.]+$/, ''))));
  const groups = new Map();

  const rel = t => t.parent.matrix.clone().multiply(t.matrix);   // twin → shared parent
  const tris = (t, M) => {   // triangles mapped by M (into the first twin's own space: scene scale, so the tolerances hold), with boxes
    const g = t.geometry, p = g.attributes.position, n = g.index ? g.index.count : p.count, out = [];
    for (let f = 0; f < n; f += 3) { const v = [0, 1, 2].map(q => new THREE.Vector3().fromBufferAttribute(p, g.index ? g.index.getX(f + q) : f + q).applyMatrix4(M)); out.push({ v, box: new THREE.Box3().setFromPoints(v) }); }
    return { t, list: out, box: new THREE.Box3().setFromPoints(out.flatMap(x => x.v)) };
  };
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), h = new THREE.Vector3(), sv = new THREE.Vector3(), qv = new THREE.Vector3();
  const segTri = (a, b, [p0, p1, p2]) => {   // Möller–Trumbore on segment a→b
    const d = b.clone().sub(a); e1.subVectors(p1, p0); e2.subVectors(p2, p0); h.crossVectors(d, e2); const det = e1.dot(h); if (Math.abs(det) < 1e-12) return null;

    qv.crossVectors(sv, e1); const v = f * d.dot(qv); if (v < 0 || u + v > 1) return null; const t = f * e2.dot(qv); return t >= 0 && t <= 1 ? a.clone().addScaledVector(d, t) : null;
  };

  groups.forEach(list => {
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const toA = rel(list[i]).invert(), A = tris(list[i], new THREE.Matrix4()), B = tris(list[j], toA.multiply(rel(list[j])));

      const out = [];
      for (const ta of A.list) { if (!ta.box.intersectsBox(B.box)) continue;
        for (const tb of B.list) { if (!ta.box.intersectsBox(tb.box)) continue;
          const pts = [];
          for (const [x, y] of [[0, 1], [1, 2], [2, 0]]) { const q1 = segTri(ta.v[x], ta.v[y], tb.v), q2 = segTri(tb.v[x], tb.v[y], ta.v); if (q1) pts.push(q1); if (q2) pts.push(q2); }
          let far = null, d0 = 1e-5; for (let a = 0; a < pts.length; a++) for (let b = a + 1; b < pts.length; b++) { const d = pts[a].distanceToSquared(pts[b]); if (d > d0) { d0 = d; far = [pts[a], pts[b]]; } }

    }

// style one mesh: hide it, give it a scene-scale twin with shell and hairlines. s = the mesh's final world scale.
function isoTwin(o, s) {
  const g = o.geometry.clone(); g.scale(s, s, s);
  for (const k in g.morphAttributes) if (k === 'position') g.morphAttributes[k].forEach(a => { for (let i = 0; i < a.array.length; i++) a.array[i] *= s; a.needsUpdate = true; });

// a robot built in code instead of loaded: build() returns { root, clips } with meshes already at scene scale, each in its

function isoBuilt(build, done) { setTimeout(async () => { try { isoBuilt0(await build(), done); } catch (e) { console.error(e); done({ err: String(e && e.message || e) }); } }, 0); }   // after the page's own setup, like a loaded model; build may be async

// load + style + fit. fit: 'sweep' fits the box the clips sweep (machines), 'rest' fits the rest pose (characters).
function isoGlb(elId, SIZE, done, { fitTo = 'auto' } = {}) {

    const root = gltf.scene, fit = new THREE.Group(); fit.add(root);

    const mixer = new THREE.AnimationMixer(root), clips = gltf.animations, actions = clips.map(c => mixer.clipAction(c));

    const seen = new Set(), canAll = clips.length > 1 && clips.every(c => { const ns = new Set(c.tracks.map(t => t.name.replace(/\.[^.]+$/, '')));
      const clash = [...ns].some(n => seen.has(n)); ns.forEach(n => seen.add(n)); return !clash; });

    mixer.stopAllAction(); root.updateMatrixWorld(true);

    const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3()), k = SIZE / Math.max(size.x, size.y, size.z);

  }, err => done({ err: String(err && err.message || err) }));
}

// generic player: one tab that plays a model's own clips (space play/pause, ←→ clip, ↑↓ speed, r restart)

    panel: [['Play / pause', 'space', toggle], ['Next clip', '→', () => step(1)], ['Faster', '↑', () => speed(1)], ['Slower', '↓', () => speed(-1)], ['Restart', 'R', restart]],
    info: `<h2>${name}</h2><p>The model's own animation clips, played on its original node tree. Each part keeps its outline and crease hairlines while it moves.</p>${credit ? `<p style="opacity:.7;margin-top:6px">${credit}</p>` : ''}`,

// The 1903 Wright Flyer built in code, in real metres: +z forward, +y up, +x the pilot's left. The root is scaled by K
// to scene units. Each component is a part group (key = its WF_INFO entry); static pieces of a part are merged into one
// mesh. Moving pieces hang on pivots: the warping wingtips, the elevator, the rudder, the propellers and the flywheel.
const WF_MODEL = (() => {
  const K = 0.5;                                          // scene units per metre
  const M0 = new THREE.MeshBasicMaterial();               // placeholder: isoBuilt restyles every solid
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const Y_LO = 0.80, Y_UP = 2.68, CHORD = 1.98;           // wing chord-line heights (gap 1.88 m) and chord
  const U_F = 0.12, U_R = 0.72;                           // front and rear spar, as fractions of the chord

  // a cambered section (camber h, thickness t) with its camber line yc and half thickness th, u = 0 at the leading edge
  function foil(c, h, t) {
    const yc = u => h * 6.75 * u * (1 - u) * (1 - u), th = u => t * 1.3 * Math.sqrt(u) * (1 - u) + 0.002;
    const z = u => (0.5 - u) * c;
    function shape(k = 1, n = 18) {                       // k < 1: a slimmer, slightly shorter section that sits inside (a rib)
      const cf = k < 1 ? 0.97 : 1, s = new THREE.Shape(), us = [];
      for (let i = 0; i <= n; i++) us.push((1 - Math.cos(Math.PI * i / n)) / 2);
      s.moveTo((us[0] - 0.5) * c * cf, yc(us[0]) + th(us[0]) * k);
      for (let i = 1; i <= n; i++) s.lineTo((us[i] - 0.5) * c * cf, yc(us[i]) + th(us[i]) * k);
      for (let i = n - 1; i >= 1; i--) s.lineTo((us[i] - 0.5) * c * cf, yc(us[i]) - th(us[i]) * k);
      return s;
    }
    // extrude along +x from x0 to x1 at height y: the shape's x becomes −z, so the leading edge faces forward
    const span = (sh, x0, x1, y) => new THREE.ExtrudeGeometry(sh, { depth: x1 - x0, bevelEnabled: false, curveSegments: 1 }).rotateY(Math.PI / 2).translate(x0, y, 0);
    return { c, yc, th, z, panel: (x0, x1, y) => span(shape(1), x0, x1, y), rib: (x, y, w = 0.012) => span(shape(0.8), x - w / 2, x + w / 2, y),
      top: (x, y, n = 14) => { const p = []; for (let i = 0; i <= n; i++) { const u = (1 - Math.cos(Math.PI * i / n)) / 2; p.push(V(x, y + yc(u) + th(u) + 0.003, z(u))); } return p; } };
  }
  const WING = foil(CHORD, CHORD / 20, 0.06), ELEV = foil(0.8, 0.04, 0.035);
  const zF = WING.z(U_F), zR = WING.z(U_R);
  const loTop = u => Y_LO + WING.yc(u) + WING.th(u), loBot = u => Y_LO + WING.yc(u) - WING.th(u);
  const upTop = u => Y_UP + WING.yc(u) + WING.th(u), upBot = u => Y_UP + WING.yc(u) - WING.th(u);

  // ── geometry helpers ──
  const at = (g, x, y, z, rx = 0, ry = 0, rz = 0) => g.applyMatrix4(new THREE.Matrix4().compose(V(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V(1, 1, 1)));
  const box = (w, h, d, x, y, z, rx, ry, rz) => at(new THREE.BoxGeometry(w, h, d), x, y, z, rx, ry, rz);
  const cyl = (r, h, x, y, z, rx, ry, rz, seg = 14) => at(new THREE.CylinderGeometry(r, r, h, seg), x, y, z, rx, ry, rz);
  const along = (g, a, b, axis) => {                     // stand geometry g (built along `axis`) between points a and b
    const d = b.clone().sub(a), q = new THREE.Quaternion().setFromUnitVectors(axis, d.normalize());
    g.applyMatrix4(new THREE.Matrix4().compose(a.clone().add(b).multiplyScalar(0.5), q, V(1, 1, 1))); g.userData.axis = d.clone(); return g;
  };
  const beam = (a, b, w, h) => along(new THREE.BoxGeometry(w, h, a.distanceTo(b)), a, b, V(0, 0, 1));
  const rod = (a, b, r, seg = 8) => along(new THREE.CylinderGeometry(r, r, a.distanceTo(b), seg), a, b, V(0, 1, 0));
  const limb = (a, b, r) => along(new THREE.CapsuleGeometry(r, Math.max(0.01, a.distanceTo(b) - 2 * r), 4, 10), a, b, V(0, 1, 0));
  // the direction wood grain runs in a piece: recorded by along(), else its longest side
  const grainOf = g => { if (g.userData.axis) return g.userData.axis; g.computeBoundingBox(); const s = g.boundingBox.getSize(V(0, 0, 0));
    return s.x >= s.y && s.x >= s.z ? V(1, 0, 0) : s.y >= s.z ? V(0, 1, 0) : V(0, 0, 1); };
  // many geometries → one indexed mesh geometry (positions, flat normals, grain axis; isoBuilt finds the hairlines on it)
  function merge(list) {
    const gs = list.map(g => { const a = grainOf(g), x = g.index ? g.toNonIndexed() : g; x.userData.axis = a; return x; });
    let n = 0; gs.forEach(g => { if (!g.attributes.normal) g.computeVertexNormals(); n += g.attributes.position.count; });
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), grn = new Float32Array(n * 3); let o = 0;
    gs.forEach(g => { const c = g.attributes.position.count; pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3);
      for (let i = 0; i < c; i++) grn.set([g.userData.axis.x, g.userData.axis.y, g.userData.axis.z], (o + i) * 3); o += c; });
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); out.setAttribute('aGrain', new THREE.BufferAttribute(grn, 3));
    out.setIndex(Array.from({ length: n }, (_, i) => i));
    return out;
  }
  const lines = (pts, closed = false) => { const a = []; for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a.push(p.x, p.y, p.z, q.x, q.y, q.z); } return a; };

  let root = null, parts = [], piv = {}, geo = {}, strutWires = [];
  function part(key, ex) {
    const g = new THREE.Group(); g.name = key; g.userData.wf = key; root.add(g);
    parts.push({ key, g, ex: V(...ex) }); return g;
  }
  const mesh = (name, geo, parent) => { const m = new THREE.Mesh(geo, M0); m.name = name; parent.add(m); return m; };
  const pivot = (parent, x, y, z) => { const p = new THREE.Group(); p.position.set(x, y, z); parent.add(p); return p; };
  const off = (g, p) => g.translate(-p.position.x, -p.position.y, -p.position.z);

  // ── wings: a centre panel and two tip panels that twist about the front spar ──
  function wing(key, y, ex) {
    const g = part(key, ex), out = {};
    for (const [side, x0, x1] of [['C', -3.2, 3.2], ['L', 3.2, 6.15], ['R', -6.15, -3.2]]) {
      const p = pivot(g, side === 'C' ? 0 : side === 'L' ? 3.2 : -3.2, y + WING.yc(U_F), zF); out[side] = p;
      mesh(key + side + 'Skin', off(merge([WING.panel(x0, x1, y)]), p), p);
      const frame = [box(x1 - x0, 0.028, 0.045, (x0 + x1) / 2, y + WING.yc(U_F), zF), box(x1 - x0, 0.022, 0.04, (x0 + x1) / 2, y + WING.yc(U_R), zR)];
      const ribX = []; for (let x = x0 + 0.16; x < x1 - 0.05; x += 0.31) ribX.push(x);
      ribX.forEach(x => frame.push(WING.rib(x, y)));
      mesh(key + side + 'Frame', off(merge(frame), p), p);
      // the rib pockets show through the fabric as fine lines on the upper surface
      const rl = []; ribX.forEach(x => rl.push(...lines(WING.top(x, y))));
      rl.push(x0, y + 0.003, WING.z(1), x1, y + 0.003, WING.z(1));      // the trailing edge is a wire the fabric is sewn to
      const l = fat(rl, lineMat); l.position.copy(p.position).negate(); p.add(l);
    }
    return out;
  }

  function build() {
    root = new THREE.Group(); root.scale.setScalar(K); parts = []; piv = {}; geo = {}; strutWires = [];
    const lo = wing('lowerWing', Y_LO, [0, 0.7, 0]), up = wing('upperWing', Y_UP, [0, 2.9, 0]);
    piv.warp = { loL: lo.L, loR: lo.R, upL: up.L, upR: up.R };

    // uprights and the crossed wires of each bay
    const XS = [0.55, 1.95, 3.35, 4.75, 6.0], xs = [...XS.map(x => -x).reverse(), ...XS];
    { const g = part('struts', [0, 1.8, 0]), list = [], w = [];
      for (const x of xs) for (const [u, z] of [[U_F, zF], [U_R, zR]]) { const b = loTop(u), t = upBot(u); list.push(box(0.028, t - b, 0.055, x, (b + t) / 2, z));
        list.push(box(0.05, 0.022, 0.075, x, b + 0.011, z), box(0.05, 0.022, 0.075, x, t - 0.011, z)); }   // metal fittings at both ends
      mesh('uprights', merge(list), g);
      for (let i = 0; i < xs.length - 1; i++) for (const [u, z] of [[U_F, zF], [U_R, zR]]) {
        const a = xs[i], b = xs[i + 1], y0 = loTop(u), y1 = upBot(u);
        w.push(a, y0, z, b, y1, z, a, y1, z, b, y0, z);
      }
      const wl = fat(w, lineMat); g.add(wl); piv.wires = wl; strutWires = w; }

    // skids: runners that sweep up at the front to carry the elevator, with posts and braces to the lower wing
    { const g = part('skids', [0, 0, 0]), list = [];
      for (const s of [-1, 1]) { const x = s * 0.55;
        const path = [V(x, 0.05, -1.05), V(x, 0.05, 1.5), V(x, 0.2, 2.15), V(x, 0.52, 2.6), V(x, 0.86, 2.85)];
        for (let i = 0; i < path.length - 1; i++) list.push(beam(path[i], path[i + 1], 0.05, 0.08));
        for (const [u, z] of [[U_F, zF], [U_R, zR]]) list.push(beam(V(x, 0.09, z), V(x, loBot(u), z), 0.04, 0.04));

// Surfaces and themes for the Flyer page.
// · Procedural textures painted in the fragment shader from object-space position (no UVs needed): muslin weave, spruce
//   grain (rings around a per-vertex grain axis, aGrain), brushed steel, wool cloth, weathered planks, granite, sand and a
//   moving sea. Every pattern fades out where it would shimmer (fwidth), and uTex scales them all (0 = flat iso-glow).
// · Themes: palettes for the scene (background, body, the three hairline tiers) and the panels (CSS variables), built on
//   the template's dark or light base so its glow rules still hold (no halos on paper themes).
const WF_LOOK = (() => {
  const U = { uTex: { value: 1 }, uTime: { value: 0 } };
  const GLSL = `
    float wfH(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float wfN(vec3 x) { vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(wfH(i), wfH(i + vec3(1, 0, 0)), f.x), mix(wfH(i + vec3(0, 1, 0)), wfH(i + vec3(1, 1, 0)), f.x), f.y),
                 mix(mix(wfH(i + vec3(0, 0, 1)), wfH(i + vec3(1, 0, 1)), f.x), mix(wfH(i + vec3(0, 1, 1)), wfH(i + vec3(1, 1, 1)), f.x), f.y), f.z); }
    float wfF(vec3 p) { return wfN(p) * 0.5 + wfN(p * 2.03) * 0.25 + wfN(p * 4.1) * 0.125; }
    float wfAA(float cycles) { return clamp(1.0 - fwidth(cycles) * 1.2, 0.0, 1.0); }   // fade a pattern before it aliases`;
  const PATTERN = {
    fabric: `vec3 an = abs(vN); vec2 q = an.y > max(an.x, an.z) ? vP.xz : (an.x > an.z ? vP.zy : vP.xy);
      float c = q.x * 42.0, d = q.y * 42.0, weave = sin(c * 6.2832) * sin(d * 6.2832) * wfAA(c) * wfAA(d);
      float seam = smoothstep(0.02, 0.0, abs(fract(q.x * 2.0) - 0.5) - 0.47) * wfAA(q.x * 2.0);
      pat = 1.0 + 0.06 * weave - 0.07 * seam + 0.06 * (wfF(vP * 5.0) - 0.5);`,
    wood: `vec3 ax = length(vG) > 0.01 ? normalize(vG) : vec3(0.0, 1.0, 0.0);
      float along = dot(vP, ax), across = length(vP - ax * along), n = wfF(vec3(along * 1.4, across * 8.0, 0.3) + vP * 0.6);
      float rc = across * 26.0 + n * 1.2, rings = (0.5 + 0.5 * sin(rc * 6.2832)) * wfAA(rc);
      float streak = wfN(vec3(along * 2.5, across * 70.0, 1.7)) * wfAA(across * 70.0);
      pat = 1.0 + 0.13 * (rings - 0.4) + 0.09 * (streak - 0.5) + 0.05 * (n - 0.5);`,
    metal: `float bc = vP.y * 140.0, b = wfN(vec3(vP.x * 3.0, bc, vP.z * 3.0)) * wfAA(bc);
      pat = 1.0 + 0.07 * (b - 0.5) + 0.07 * (wfF(vP * 8.0) - 0.5);`,
    cloth: `float c = (vP.x + vP.z) * 60.0, d = (vP.y - vP.z) * 60.0;
      pat = 1.0 + 0.06 * sin(c * 6.2832) * sin(d * 6.2832) * wfAA(c) * wfAA(d) + 0.06 * (wfF(vP * 12.0) - 0.5);`,
    planks: `float y = vP.y * 6.5, seam = smoothstep(0.08, 0.0, abs(fract(y) - 0.5) - 0.42) * wfAA(y);
      float grain = wfF(vec3((vP.x + vP.z) * 1.6, y * 6.0, floor(y) * 3.1)), knot = smoothstep(0.82, 0.9, wfN(vec3(vP.x + vP.z, y, 0.0) * 3.0));
      pat = 1.0 + 0.14 * (grain - 0.5) - 0.2 * seam - 0.12 * knot;`,
    stone: `float sp = wfH(floor(vP * 55.0)) * wfAA(vP.x * 55.0);
      pat = 1.0 + 0.18 * (wfF(vP * 6.0) - 0.5) + 0.1 * (sp - 0.5);`,
    sand: `float rp = vP.x * 0.45 + vP.z * 0.16 + wfF(vP * 0.2) * 0.8, r = sin(rp * 6.2832) * wfAA(rp);
      float sp = wfH(floor(vP * 16.0)) * wfAA(vP.x * 16.0);
      pat = 1.0 + 0.05 * r + 0.06 * (sp - 0.5) + 0.09 * (wfF(vP * 0.07) - 0.5);`,
    studio: `float sp = wfH(floor(vP * 9.0)) * wfAA(vP.x * 9.0);
      pat = 1.0 + 0.05 * (wfF(vP * 0.35) - 0.5) + 0.035 * (sp - 0.5);`,
    sea: `float t = uTime * 0.35, sc = vP.x * 0.16 + t + wfF(vec3(vP.xz * 0.12, t * 0.2)) * 0.7, sw = sin(sc * 6.2832) * wfAA(sc);
      pat = 1.0 + 0.09 * sw + 0.08 * (wfF(vec3(vP.xz * 0.5, t)) - 0.5);`,
  };
  // how each surface leans away from the theme's body colour: toward its own hue, a little on dark themes, more on paper
  const HUE = { fabric: ['#e3d6b4', 0.07, 0.32], wood: ['#a0703e', 0.13, 0.36], metal: ['#8d99a6', 0.11, 0.26], cloth: ['#2e2e36', 0.1, 0.55],
    planks: ['#8f6c47', 0.13, 0.38], stone: ['#a3a39d', 0.1, 0.3], sand: ['#cdb47c', 0.08, 0.32], studio: ['#8e959c', 0.06, 0.55, '#ffffff'], sea: ['#2d5f80', 0.16, 0.4] };
  const mats = [];
  function surface(kind, { rough = 0.88, metal = 0.04, scale = 1 } = {}) {
    const m = new THREE.MeshStandardMaterial({ color: 0x1b1c1f, roughness: rough, metalness: metal, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    m.userData.wfKind = kind;

      sh.uniforms.uTex = U.uTex; sh.uniforms.uTime = U.uTime;
      sh.vertexShader = 'attribute vec3 aGrain;\nvarying vec3 vP; varying vec3 vN; varying vec3 vG;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>\n vP = position * ${scale.toFixed(4)}; vN = normal; vG = aGrain;`);
      sh.fragmentShader = 'uniform float uTex; uniform float uTime;\nvarying vec3 vP; varying vec3 vN; varying vec3 vG;\n' + GLSL + '\n' +
        sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>\n { float pat = 1.0; ${PATTERN[kind]} diffuseColor.rgb *= mix(1.0, pat, uTex); }`);
    };

  }
  let paper = false;
  const tmp = new THREE.Color();
  function retintOne(m) { const [hex, kd, kl, light] = HUE[m.userData.wfKind]; m.color.copy(bodyMat.color).lerp(tmp.set(paper && light ? light : hex), paper ? kl : kd); }
  const retint = () => mats.forEach(retintOne);

  // ── themes ──

    const fr = [];

    A.tipL = WF_FX.arrow('lift', group, { head: 0.22 }); A.tipR = WF_FX.arrow('lift', group, { head: 0.22 }); A.yaw = WF_FX.arrow('motion', group, { head: 0.25 }); A.turn = WF_FX.arrow('motion', group, { head: 0.3 });
    for (const k of ['lift', 'weight', 'thrust', 'drag']) LB[k] = WF_FX.label('', { role: k, cls: 'force' }).at(out => active && A[k].g.visible ? A[k].tipWorld(out) : null);

  const lamps = [], A = {}, LB = {};

  // the flow: oncoming air (toward −z) plus the wings' vortices; the wake behind a stalled wing churns

  if (active !== 'tw' || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'INPUT') return;
  if (e.repeat && e.key === 'Enter') { e.preventDefault(); return; }
  if (twPress(e.key)) e.preventDefault();
});

// ── load the embedded parts file ──
// (Seahawk removed from this page — the model and its loader live in 'Iso 3D (with Seahawk) backup.html')

// ── animation ──
let last = performance.now(), sig = '';
const tmpV = new THREE.Vector2();
const ease = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  st.rpm = st.eng ? Math.min(1, st.rpm + 0.16 * dt) : Math.max(0, st.rpm - 0.07 * dt);
  st.mr += st.rpm * 7.5 * dt;                 // counter-clockwise from above; slowed on screen (real 27 rad/s strobes)
  st.tr += st.rpm * 7.5 * 4.6 * dt * 0.5;
  const goal = st.rpm >= 0.95 ? st.tAlt : 0;
  st.alt += Math.sign(goal - st.alt) * Math.min(Math.abs(goal - st.alt), 0.9 * dt);
  if (st.msg === 'waiting for rotor speed' && st.rpm >= 0.95) st.msg = '';
  st.doorT += ((st.door ? 1 : 0) - st.doorT) * Math.min(1, dt * 3);
  if (mainRotor) {
    mainRotor.quaternion.setFromAxisAngle(mrAxis, st.mr);
    tailRotor.quaternion.setFromAxisAngle(trAxis, st.tr);
    if (doorMesh) { const e = ease(st.doorT); doorMesh.position.z = -1.95 * e; doorMesh.position.x = -0.04 * Math.min(1, e * 4); }
    if (doorPortMesh) doorPortMesh.position.z = 1.2 * (1 - ease(st.doorT));   // closed = slid forward over the doorway
    heli.position.y = st.alt;
  }
  const lift = 1 - Math.min(1, st.alt / 9);
  shadowMat.uniforms.opacity.value = THEMES[theme].shadow * lift;
  spotMat.uniforms.opacity.value = st.lights ? 0.45 * (1 - Math.min(0.8, st.alt / 8)) : 0;
  spillMat.uniforms.opacity.value = st.cabin ? 0.4 * ease(st.doorT) * lift : 0;
  if (camAnim) {
    // while snapping back to the iso view, drop leftover drag momentum and pause the revolve so it lands exactly
    if (camAnim.t === 0) { camAnim.spin = controls.autoRotate; controls.autoRotate = false; controls.enableDamping = false; }
    camAnim.t = Math.min(1, camAnim.t + dt / 0.8); const k = ease(camAnim.t);
    const v = camAnim.v;
    controls.target.lerpVectors(camAnim.fromT, v.target, k);
    camera.position.lerpVectors(camAnim.from, v.target.clone().addScaledVector(v.dir, v.dist()), k);
    if (camera === ortho && camAnim.zoom0 !== undefined) { ortho.zoom = THREE.MathUtils.lerp(camAnim.zoom0, 1, k); ortho.updateProjectionMatrix(); }
    if (camAnim.t >= 1) { controls.enableDamping = true; controls.autoRotate = camAnim.spin; camAnim = null; }
  }
  if (active === 'tw') twTick(now, dt);
  if (active === 'dr') { DR.tick(now, dt); tickFlashes(now); }
  if (active === 'cs') CS.tick(now, dt);
  if (active === 'tm') TM.tick(now, dt);
  if (active === 'vm') VM.tick(now, dt);
  if (EXTRA[active]) EXTRA[active].tick(now, dt);
  const s = `${Math.round(st.rpm * RPM)}|${st.alt.toFixed(1)}|${st.msg}`;
  if (s !== sig) { sig = s; render(); }
  controls.update();
  applyWeight();
  const bufH = renderer.getDrawingBufferSize(tmpV).y, pxScale = camera === ortho ? bufH * ortho.zoom / orthoH : bufH / fovK();
  glowMats.forEach(m => m.uniforms.scale.value = pxScale);

}
addEventListener('resize', () => {
  persp.aspect = innerWidth / innerHeight; persp.updateProjectionMatrix(); orthoFrustum();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  outlineMat.uniforms.res.value.copy(devRes()); lineMat.resolution.copy(devRes()); majorMat.resolution.copy(devRes()); accentLineMat.resolution.copy(devRes()); appliedKey = '';
});
render();
document.querySelectorAll('.seg button').forEach(b => { b.hidden = !SHOW_FIGS.includes(b.dataset.fig); });
if (SHOW_FIGS.length < 2) document.querySelector('.seg').hidden = true;   // one figure: no tab bar
setFigure(SHOW_FIGS.includes(load('fig')) ? load('fig') : SHOW_FIGS[0]);
if (load('ortho') === '1') setOrtho(true, view().dist());
// ── glow colour: same names and order as the 2D galleries (Ember is the 3D orange); shared choice with them via 'iso-accent' ──
const ACCENTS3 = [['Ember', '#ff9d3c'], ['Cyan', '#22d3ee'], ['Lime', '#a3e635'], ['Violet', '#a78bfa'], ['Rose', '#fb7185'], ['Ice', '#dfe9ef']];
const swEl = document.getElementById('swatches');
swEl.innerHTML = ACCENTS3.map(([n, c]) => `<button role="radio" data-accent="${n.toLowerCase()}" aria-label="${n}" title="${n}" style="--sw:${c}"><i></i></button>`).join('');
function pickAccent(k) {
  const a = ACCENTS3.find(x => x[0].toLowerCase() === k) || ACCENTS3[0]; k = a[0].toLowerCase();
  const old = accent.clone(); setAccent(a[1]);
  const swap = c => { if (c && c.isColor && c.equals(old)) c.copy(accent); };
  scene.traverse(o => [].concat(o.material || []).forEach(m => {   // every part that carries the accent: emissive lights, accent lines, LEDs, glow sprites
    if (m.emissive && m.emissive.getHex() !== 0) m.emissive.copy(accent);
    swap(m.color); if (m.uniforms) Object.values(m.uniforms).forEach(u => swap(u.value)); }));
  accentLineMat.color.copy(accent); ledOnMat.color.copy(accent);
  themeHooks.forEach(f => f(theme));                                // screens, labels and pools redraw with the new colour
  swEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.accent === k ? 'true' : 'false'));
  try { localStorage.setItem('iso-accent', k); } catch (e) {}
  try { if (parent !== window) parent.document.documentElement.style.setProperty('--accent', a[1]); } catch (e) {}   // the /demo shell around this page follows the choice
}
swEl.addEventListener('click', e => { const b = e.target.closest('button[data-accent]'); if (b) { pickAccent(b.dataset.accent); b.blur(); } });
addEventListener('storage', e => { if (e.key === 'iso-accent' && e.newValue) pickAccent(e.newValue); });
{ let k = null; try { k = localStorage.getItem('iso-accent'); } catch (e) {} pickAccent(k || 'ember'); }
requestAnimationFrame(frame);
